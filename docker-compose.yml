services:

  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASSWORD    
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    
  redis:
    image: redis:alpine    

  web:
    build: .
    env_file:
      - .env    
    volumes:
      - webstatic_data:/app/staticfiles
    command: gunicorn --chdir cicdproject cicdproject.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres_data:
  webstatic_data:
